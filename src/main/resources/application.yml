# Design Ref: §10.3
# 외부 인프라·환경변수 없이 `./gradlew bootRun` 만으로 기동되어야 한다 (Plan NFR 재현성).
spring:
  application:
    name: klass                     # Design §12 D-5 — 원본 jwt-auth 에서 변경

  datasource:
    url: jdbc:h2:mem:klass;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  issuer: klass                     # Design §12 D-5 — 원본 sample-jwt-authentication 에서 변경
  # ⚠️ 학습용 기본값이라 평문이다. Design §7 — 실서비스 전 환경변수로 분리할 것.
  #    Base64 디코딩 시 32바이트 이상이어야 HS256 서명이 가능하다.
  secret: a2xhc3MtcHJvamVjdC1kZW1vLXNlY3JldC1rZXktMzJieXRlcy1taW5pbXVtLWxlbmd0aA==
  # ISO-8601 Duration 표기. Duration 타입으로 바인딩된다.
  access-token-validity: PT30M
  refresh-token-validity: P14D
  # 만료된 Access 토큰 폐기 기록(revoked_access_token)을 정리하는 주기.
  # 이 정리가 없으면 테이블이 로그아웃 횟수만큼 무한히 자란다 (FR-11).
  revoked-token-cleanup-interval: PT10M

app:
  # Design §12 D-6 — 원본은 단일 계정이었다. ERD 정본 §7 의 권한 검증 지점을 확인하려면
  # ROLE_CREATOR 계정이 필요해 목록 구조로 바꿨다.
  default-users:
    - username: chals
      password: test
      roles:
        - ROLE_USER
    - username: creator
      password: test
      roles:
        - ROLE_USER
        - ROLE_CREATOR

  # 수강신청 정책. ⚠️ pending-expiry 블록을 빠뜨리면 기동은 성공하고 첫 신청에서 NPE 가
  # 난다 — 중첩 record 가 예외 없이 null 로 바인딩되기 때문이다 (Design §4.1.1 ⑤).
  enrollment:
    # klass.cancellation_period_days 가 NULL 일 때의 전역 기본값. 결제일 기준 일수다.
    # 전자상거래법 단순변심 기간과 같은 값이라 직관적이다.
    default-cancellation-period-days: 7
    # 결제 대기 만료 기한. ISO-8601 Duration 표기 (ERD 정본 §2 ⑥).
    # 이 기한이 지나면 아래 reap-interval 주기의 배치가 회수한다 (D-32 해소).
    # ck_enrollment_pending 이 expires_at 을 강제하고 결제 확정도 이 값을 본다.
    pending-expiry:
      direct: PT30M     # 직접 신청. 결제 수단 준비 시간
      waitlist: PT10M   # 승격. 뒷 순번을 오래 붙잡지 않는다
    # 만료 회수 배치 주기. @Scheduled 가 placeholder 로 직접 읽는다 (auth 선례와 동일).
    # ⚠️ 키 오타는 예외 없이 기본값 PT10M 으로 대체되며 어떤 테스트도 잡지 못한다 —
    # 기본값이 곧 요구사항 값이라 실질 피해가 없어 받아들인 대가다 (Design §10.2)
    reap-interval: PT10M
    # 한 번의 실행에서 처리할 상한. 남은 것은 다음 실행이 가져간다 (Design D-50).
    # ⚠️ 이 줄을 지우면 @DefaultValue 가 200 을 채운다. 0 이 되면 배치가 조용히 멈춘다
    reap-batch-size: 200

springdoc:
  # RestDocs 기반 openapi3.json 이 정본이고, springdoc 은 런타임 보조 문서다 (Design §4.3).
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.hibernate.SQL: debug
